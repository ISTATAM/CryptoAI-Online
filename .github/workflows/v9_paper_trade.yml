name: CryptoAI V9 Paper Trading

on:
  workflow_dispatch:

  schedule:
    # Binance 1D K線以 UTC 為基準。
    # 每天 UTC 00:00 收盤後，預留 15 分鐘再執行。
    # 台灣時間約每天 08:15。
    - cron: '15 0 * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: cryptoai-v9-paper-trading
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ======================================================
      # 1. 下載 GitHub 專案
      # ======================================================
      - name: Download project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. 安裝 Python
      # ======================================================
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ======================================================
      # 3. 安裝套件
      # ======================================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2"

      # ======================================================
      # 4. 尋找已經封存的 V9 Production Model
      # ======================================================
      - name: Find V9 production model
        id: find-model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "build_v9_model.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "找不到成功的 V9 Production Model"
            exit 1
          fi

          echo "找到 V9 Model Run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # ======================================================
      # 5. 下載封存模型
      # ======================================================
      - name: Download locked V9 model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v9_model

          gh run download \
            "${{ steps.find-model.outputs.run_id }}" \
            --name cryptoai-v9-production-model \
            --dir downloaded_model

          cp -r downloaded_model/. v9_model/

          echo "=============================="
          echo "正式模型檔案"
          echo "=============================="

          ls -lh v9_model/

          echo ""
          echo "=============================="
          echo "正式模型 SHA256"
          echo "=============================="

          cat v9_model/model_sha256.txt

      - name: Validate V9 Python scripts
        run: |
          python -m py_compile v9_paper_trade.py
          python -m py_compile v9_settle_paper_trades.py

      # ======================================================
      # 6. V9-3
      # 先處理以前留下來的 Paper Trading
      #
      # WAIT_ENTRY
      #     ↓
      # WAIT_EXIT
      #     ↓
      # CLOSED
      # ======================================================
      - name: Settle existing paper trades
        run: |
          echo "======================================"
          echo "開始處理既有 Paper Trading"
          echo "======================================"

          python v9_settle_paper_trades.py

      # ======================================================
      # 7. V9-2
      # 掃描最新完成的 1D K線
      #
      # AI >= 70%
      # 才建立新的 WAIT_ENTRY
      # ======================================================
      - name: Run V9 paper trading scanner
        run: |
          echo "======================================"
          echo "開始執行 V9 每日 AI 掃描"
          echo "======================================"

          python v9_paper_trade.py

      # ======================================================
      # 8. V9-3
      # Scanner 執行完成後再檢查一次
      #
      # 新訊號正常情況下不會立刻成交。
      # 主要用途是增加漏跑/中斷後的恢復能力。
      # ======================================================
      - name: Recheck paper trade settlement
        run: |
          echo "======================================"
          echo "再次檢查 Paper Trading 結算"
          echo "======================================"

          python v9_settle_paper_trades.py

      # ======================================================
      # 9. 把 Paper Trading 紀錄永久存回 GitHub
      # ======================================================
      - name: Save paper trading history
        run: |
          git config user.name "CryptoAI V9 Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add paper_trading/

          if git diff --cached --quiet; then
            echo "======================================"
            echo "沒有新的 Paper Trading 資料需要 Commit"
            echo "======================================"
            exit 0
          fi

          echo "======================================"
          echo "發現新的 Paper Trading 資料"
          echo "準備寫回 GitHub"
          echo "======================================"

          git commit -m "Update V9 paper trading data"

          git pull --rebase origin main

          git push origin main

          echo "======================================"
          echo "Paper Trading 資料已成功寫回 GitHub"
          echo "======================================"

      # ======================================================
      # 10. 同時保存 Artifact
      # ======================================================
      - name: Upload latest V9 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoai-v9-paper-trading-latest
          path: |
            paper_trading/
          if-no-files-found: warn
          retention-days: 30
