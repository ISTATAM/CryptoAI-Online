name: CryptoAI V9 Paper Trading

on:
  workflow_dispatch:

  schedule:
    # 台灣時間約 08:17 / 09:23 / 10:37 / 12:43。
    - cron: '17 0 * * *'
    - cron: '23 1 * * *'
    - cron: '37 2 * * *'
    - cron: '43 4 * * *'

permissions:
  actions: read
  contents: write

concurrency:
  group: cryptoai-v9-paper-trading
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 下載專案
      - name: Download project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 檢查每日掃描鎖
      - name: Check daily schedule lock
        id: daily-lock
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動執行：不套用每日排程鎖"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          p = Path("paper_trading/latest_summary.json")
          skip = False

          if p.exists():
              try:
                  data = json.loads(
                      p.read_text(encoding="utf-8-sig")
                  )
                  recorded = data.get("recorded_at_utc")

                  if recorded:
                      run_time = datetime.fromisoformat(
                          recorded.replace("Z", "+00:00")
                      )
                      now = datetime.now(timezone.utc)
                      expected_signal_day = (
                          now - timedelta(days=1)
                      ).date()

                      top = data.get("top_predictions") or []
                      signal_days = set()

                      for row in top:
                          value = row.get("signal_open_time")
                          if value:
                              signal_days.add(
                                  datetime.fromisoformat(
                                      value.replace("Z", "+00:00")
                                  ).date()
                              )

                      if (
                          run_time.date() == now.date()
                          and expected_signal_day in signal_days
                      ):
                          skip = True

              except Exception as exc:
                  print(
                      f"讀取每日鎖失敗，繼續執行：{exc}"
                  )

          with open(
              "/tmp/v9_skip.txt", "w", encoding="utf-8"
          ) as f:
              f.write("true" if skip else "false")

          print(
              "今日已完成，跳過備援掃描。"
              if skip
              else "今日尚未完成，繼續掃描。"
          )
          PY

          echo "skip=$(cat /tmp/v9_skip.txt)" >> "$GITHUB_OUTPUT"

      - name: Stop duplicate scheduled run
        if: steps.daily-lock.outputs.skip == 'true'
        run: |
          echo "今天最新完成的日 K 已掃描。"
          echo "跳過重複掃描，仍會檢查 LINE 通知。"

      # 3. 安裝 Python
      # 跳過掃描時仍需要 Python 執行通知程式。
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. 安裝掃描套件
      - name: Install packages
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2"

      # 5. 固定正式模型
      - name: Pin V9 production model
        id: find-model
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          echo "run_id=36669776568" >> "$GITHUB_OUTPUT"
          echo "鎖定 V9 Model Run ID: 36669776568"

      # 6. 下載模型並驗證 SHA256
      - name: Download locked V9 model
        if: steps.daily-lock.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v9_model

          gh run download \
            "${{ steps.find-model.outputs.run_id }}" \
            --name cryptoai-v9-production-model \
            --dir downloaded_model

          cp -r downloaded_model/. v9_model/

          echo "正式模型檔案"
          ls -lh v9_model/

          echo "正式模型 SHA256"
          cat v9_model/model_sha256.txt

          EXPECTED_MODEL_SHA="ece817275f2ab9790d62532cbe24af595b2b175485f01b26850a96c03848ed7b"
          ACTUAL_MODEL_SHA=$(sha256sum v9_model/cryptoai_v9_1d.pkl | awk '{print $1}')

          echo "Expected: $EXPECTED_MODEL_SHA"
          echo "Actual:   $ACTUAL_MODEL_SHA"

          if [ "$ACTUAL_MODEL_SHA" != "$EXPECTED_MODEL_SHA" ]; then
            echo "正式模型 SHA256 不一致，停止執行。"
            exit 1
          fi

          echo "正式模型 SHA256 驗證成功。"

      # 7. 檢查掃描程式
      - name: Validate V9 Python scripts
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python -m py_compile v9_paper_trade.py
          python -m py_compile v9_settle_paper_trades.py
          python -m py_compile v9_performance_report.py

      # 8. 處理既有模擬交易
      - name: Settle existing paper trades
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python v9_settle_paper_trades.py

      # 9. 執行最新完成日 K 掃描
      - name: Run V9 paper trading scanner
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python v9_paper_trade.py

      # 10. 再次檢查模擬交易結算
      - name: Recheck paper trade settlement
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python v9_settle_paper_trades.py

      # 11. 更新模擬交易績效
      - name: Build V9 performance report
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          python v9_performance_report.py

      # 12. 永久保存資料到 GitHub
      - name: Save paper trading history
        if: steps.daily-lock.outputs.skip != 'true'
        run: |
          git config user.name "CryptoAI V9 Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add paper_trading/

          if git diff --cached --quiet; then
            echo "沒有新的 Paper Trading 資料需要 Commit"
            exit 0
          fi

          git commit -m "Update V9 paper trading data"
          git pull --rebase origin main
          git push origin main

          echo "Paper Trading 資料已成功寫回 GitHub"

      # 13. 傳送 LINE 通知
      # 前面步驟成功才通知。
      # 跳過重複掃描時，仍使用已保存資料補查通知。
      - name: Send V10 LINE notification
        if: success()
        timeout-minutes: 12
        env:
          V10_NOTIFY_URL: ${{ secrets.V10_NOTIFY_URL }}
          V10_NOTIFY_SECRET: ${{ secrets.V10_NOTIFY_SECRET }}
          V10_SUMMARY_PATH: paper_trading/latest_summary.json
        run: |
          python notify_line.py

      # 14. 保存 Artifact
      - name: Upload latest V9 report
        if: always() && steps.daily-lock.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cryptoai-v9-paper-trading-latest
          path: |
            paper_trading/
          if-no-files-found: warn
          retention-days: 30
