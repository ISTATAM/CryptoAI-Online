name: CryptoAI V9 Build Production Model

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2"

      - name: Find successful V7 fixed dataset
        id: find-v7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "backtest_v7.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "找不到成功的 V7 執行紀錄"
            exit 1
          fi

          echo "V7 Run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download fixed V7 dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            "${{ steps.find-v7.outputs.run_id }}" \
            --name cryptoai-v7-fixed-dataset \
            --dir v7_fixed

      - name: Restore fixed dataset
        run: |
          mkdir -p training
          cp -r v7_fixed/training/. training/

          echo "V7 原始 SHA256："
          cat v7_fixed/dataset_sha256.txt

          echo ""
          echo "V9 使用的 1D SHA256："
          sha256sum training/training_1d.csv

      - name: Build V9 production model
        run: python train_v9_production.py

      - name: Upload V9 production model
        uses: actions/upload-artifact@v4
        with:
          name: cryptoai-v9-production-model
          path: |
            v9_model/
          if-no-files-found: error
          retention-days: 90
