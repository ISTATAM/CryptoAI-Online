
name: Train CryptoAI Models

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    timeout-minutes: 90

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<2"

      - name: Select high liquidity coins
        run: python select_coins.py

      - name: Download historical market data
        run: python download_history.py

      - name: Build AI training data
        run: python build_features.py

      - name: Train three AI models
        run: python train_models.py

      - name: Upload AI models and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoai-v4-models
          path: |
            models/
            reports/
            training/training_summary.json
            output/selected_coins.csv
            output/history_download_report.csv
          if-no-files-found: warn
          retention-days: 7
